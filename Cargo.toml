[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/cli",
    "crates/providers",
    "crates/runtime",
    "crates/storage",
    "crates/telemetry",
    "crates/scenes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agenthub-storage = { path = "crates/storage" }
agenthub-telemetry = { path = "crates/telemetry" }
agenthub-providers = { path = "crates/providers" }
agenthub-runtime = { path = "crates/runtime" }
agenthub-api = { path = "crates/api" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
